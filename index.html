<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- viewport-fit=cover: sense això, l'app instal·lada a un iPhone amb
         osca queda emmarcada per bandes negres i el mapa no arriba a la vora.
         A canvi, tot el que sigui fix a dalt o a baix ha de respectar
         env(safe-area-inset-*) o queda sota la barra d'inici. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Color de la barra d'estat / de l'ombra del navegador. Ha de ser el
         mateix que --bg-page i que el manifest, o es veu una franja d'un altre
         color sobre el fons nocturn. -->
    <meta name="theme-color" content="#05060B" />

    <!-- L'app és fosca sempre: així els controls natius (barres de
         desplaçament, camps de formulari) surten en variant fosca. -->
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- iOS ignora el manifest per a la icona de la pantalla d'inici: només
         llegeix apple-touch-icon, i només en PNG. -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />

    <!-- Encara cal, tot i que Safari 15.4+ ja llegeix `display: standalone`
         del manifest: els iPhone amb iOS anterior només s'obren sense barres
         del navegador amb aquesta meta. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 'black-translucent' fa que el contingut passi per sota de la barra
         d'estat; combinat amb viewport-fit=cover és el que dona la pantalla
         completa de veritat. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="eclipsi.info" />

    <!-- Els telèfons detecten "12:47:03" o "17:46" com a números de telèfon i
         els converteixen en enllaços blaus. L'app és tota xifres. -->
    <meta name="format-detection" content="telephone=no" />

    <title>eclipsi.info · Quants segons d’eclipsi veuràs des d’on seràs</title>

    <!-- ================================================================
         METADADES SOCIALS I DE CERCA

         Fins ara no n'hi havia CAP. Enganxar l'enllaç a WhatsApp —que és el
         canal pel qual corre una app com aquesta— ensenyava la URL pelada,
         sense títol, sense descripció i sense imatge: llegeix com a brossa i
         ningú no hi clica. I Google s'havia d'improvisar el resum a partir
         d'una pàgina que, abans que arrenqui React, és un `<div>` buit.

         Són estàtiques a posta. Sense servidor no es pot generar una targeta
         per lloc («1 min 42 s des de Peníscola»), i fingir que sí amb
         JavaScript no serveix de res: cap rastrejador d'enllaços executa
         scripts. La targeta per punt demana pre-renderitzar en compilació, que
         és una altra feina; això és el mínim perquè un enllaç compartit tingui
         cara.
         ================================================================= -->
    <meta
      name="description"
      content="Des del punt exacte on seràs: quants segons de totalitat veuràs de debò, a quina hora, cap a on mirar i si el relleu te la tapa. Eclipsis del 12 d’agost de 2026, 2 d’agost de 2027 i 26 de gener de 2028. El càlcul es fa al teu dispositiu."
    />
    <link rel="canonical" href="%SITE_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="eclipsi.info" />
    <meta property="og:locale" content="ca_ES" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta
      property="og:title"
      content="Quants segons d’eclipsi veuràs des d’on seràs"
    />
    <meta
      property="og:description"
      content="Càlcul topocèntric i horitzó real del teu punt: la durada que et deixa el relleu, no la del catàleg. 12.08.2026 · 02.08.2027 · 26.01.2028"
    />
    <!-- Targeta pròpia de 1200×630 (public/brand/og.png): fons del sistema,
         corona i la pregunta que és el títol del producte. És estàtica: la
         targeta PER PUNT amb el veredicte continua demanant pre-renderitzat
         en compilació i queda per a més endavant. -->
    <meta property="og:image" content="%SITE_URL%brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="eclipsi.info · Quants segons d’eclipsi veuràs des d’on seràs?"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Quants segons d’eclipsi veuràs des d’on seràs"
    />
    <meta
      name="twitter:description"
      content="Càlcul topocèntric i horitzó real del teu punt: la durada que et deixa el relleu, no la del catàleg."
    />
    <meta name="twitter:image" content="%SITE_URL%brand/og.png" />

    <!-- Dades estructurades: un eclipsi ÉS un esdeveniment, i és el vocabulari
         que Google entén. Les hores són les del màxim de l'eclipsi a la
         península, en UTC, i no depenen del lloc de ningú: les del punt de
         l'usuari les calcula l'app i no es poden posar aquí. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "eclipsi.info",
        "url": "%SITE_URL%",
        "applicationCategory": "https://schema.org/EducationalApplication",
        "operatingSystem": "Web",
        "inLanguage": ["ca", "es"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "description": "Simulador dels eclipsis solars del 2026, 2027 i 2028 amb càlcul topocèntric i perfil d’horitzó real del punt de l’observador.",
        "about": [
          {
            "@type": "Event",
            "name": "Eclipsi solar total del 12 d’agost de 2026",
            "startDate": "2026-08-12T17:34:00Z",
            "endDate": "2026-08-12T19:38:00Z",
            "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
            "eventStatus": "https://schema.org/EventScheduled",
            "location": {
              "@type": "Place",
              "name": "Franja de totalitat: Islàndia i el nord d’Espanya"
            }
          },
          {
            "@type": "Event",
            "name": "Eclipsi solar del 2 d’agost de 2027",
            "startDate": "2027-08-02T07:30:00Z",
            "endDate": "2027-08-02T12:04:00Z",
            "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
            "eventStatus": "https://schema.org/EventScheduled",
            "location": {
              "@type": "Place",
              "name": "Nord d’Àfrica; parcial des d’Espanya"
            }
          },
          {
            "@type": "Event",
            "name": "Eclipsi solar anular del 26 de gener de 2028",
            "startDate": "2028-01-26T13:10:00Z",
            "endDate": "2028-01-26T17:00:00Z",
            "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
            "eventStatus": "https://schema.org/EventScheduled",
            "location": {
              "@type": "Place",
              "name": "Anular des de la península Ibèrica"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
