    <!-- Google Analytics (gtag.js), amb DUES defenses que aquest producte
         exigeix i que NO s'han de treure a la lleugera:

         1) MAI LA UBICACIÓ. L'adreça de l'app porta les coordenades de
            l'usuari (?p=lat,lon): enviar page_location tal qual regalaria a
            Google la posició exacta de cada visitant, i la promesa del peu
            —«la teva ubicació no surt d'aquí»— es tornaria mentida. Es
            retalla la consulta sencera i només viatgen origen, camí i
            fragment (#/mapa…), que és el que de debò diu quina pantalla es
            mira.

         2) SENSE GALETA FINS QUE ALGÚ DIGUI QUE SÍ, I MAI CAP SENYAL
            PUBLICITARI. El consentiment arrenca DENEGAT (Consent Mode: pings
            sense galeta) i google_signals queda fora per sempre.

            AIXÒ VA CANVIAR EL 4 D'AGOST DE 2026 i aquí hi deia «sense bàner de
            cookies». Hi havia bàner zero perquè no hi havia galeta cap, i el
            preu era que la xifra d'«Usuaris» de GA4 no eren persones sinó
            càrregues de pàgina: sense galeta no hi ha client_id que duri d'una
            visita a l'altra, i qui torna dimecres compta com algú nou. Ara hi
            ha bàner (features/consent/) i la galeta existeix NOMÉS si s'accepta.

            El que NO s'ha mogut ni es mou: ad_storage, ad_user_data i
            ad_personalization es queden denegats per sempre i el bàner ni els
            menciona, perquè d'això no se'n demana permís — simplement no es fa.
            L'única casella que el sí de l'usuari pot obrir és analytics_storage.

         El script extern no és al precache: sense xarxa simplement no
         carrega i l'app no se n'assabenta. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1KCV75E6K8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
      // EL SÍ QUE JA ESTAVA DONAT, APLICAT ABANS DE LA PRIMERA VISTA.
      //
      // PER QUÈ AQUÍ I NO AL BUNDLE. El `gtag('config')` de sota envia el
      // primer `page_view` immediatament, i el bundle de React encara triga
      // centenars de mil·lisegons a arrencar. Si el consentiment s'apliqués
      // només des de `features/consent/`, la PRIMERA vista de cada sessió
      // sortiria sense galeta: l'usuari que ja va dir que sí es tornaria a
      // comptar com a persona nova a cada visita, que és exactament el
      // problema que el bàner venia a resoldre.
      //
      // AIXÒ ÉS UN MIRALL, I EL MIRALL TÉ VIGILANT. La font de la veritat és
      // `src/core/analytics/consent.ts`; aquestes línies en són una còpia
      // mínima perquè han de córrer abans que existeixi cap mòdul. Perquè les
      // dues no divergeixin en silenci hi ha `src/analytics/consent-agreement.test.ts`,
      // que llegeix AQUEST fitxer i compara la clau i els terminis amb els del
      // nucli. Si toques un número d'aquí, el test peta; és la seva feina.
      //
      // I FALLA TANCADA, com el nucli: qualsevol cosa rara —sense clau, JSON
      // trencat, data absent, data al futur, consentiment caducat— es queda amb
      // el `denied` per defecte de dalt.
      try {
        var eclipsiRaw = localStorage.getItem('eclipsi.consent');
        if (eclipsiRaw) {
          var eclipsiSaved = JSON.parse(eclipsiRaw);
          var eclipsiAge = Date.now() - eclipsiSaved.at;
          if (
            eclipsiSaved.choice === 'granted' &&
            typeof eclipsiSaved.at === 'number' &&
            isFinite(eclipsiSaved.at) &&
            eclipsiAge > -300000 &&
            eclipsiAge <= 31536000000
          ) {
            gtag('consent', 'update', { analytics_storage: 'granted' });
          }
        }
      } catch (e) {
        // localStorage pot llançar (Safari privat, política d'empresa) i un
        // JSON trencat també. Cap de les dues coses pot endur-se la pàgina per
        // una mètrica: sense consentiment aplicat, es mesura sense galeta.
      }

      gtag('js', new Date());
      function eclipsiPage() {
        return location.origin + location.pathname + location.hash;
      }
      // EL RETALL, TAMBÉ COM A PARÀMETRE GLOBAL. La «mesura millorada» de GA4
      // ve activada per defecte i envia vistes de pàgina pel seu compte a cada
      // canvi d'historial — i aquesta app crida replaceState CADA COP que
      // toques el mapa, amb ?p=lat,lon a l'adreça. El retall del `config` no
      // governa el que gtag.js enviï sol; el de `set`, sí.
      gtag('set', { page_location: eclipsiPage() });
      gtag('config', 'G-1KCV75E6K8', {
        page_location: eclipsiPage(),
        allow_google_signals: false,
        allow_ad_personalization_signals: false
      });
      // Les pestanyes són rutes hash: cada canvi és una vista de pàgina,
      // sempre amb l'adreça retallada.
      addEventListener('hashchange', function () {
        // Es refresca el global perquè no quedi congelat a la ruta d'arrencada.
        gtag('set', { page_location: eclipsiPage() });
        gtag('event', 'page_view', { page_location: eclipsiPage() });
      });
    </script>
