<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="eclipsi.info">
  <!-- Icona vectorial per a navegadors que accepten SVG al manifest.
       iOS no la fa servir mai: alla mana apple-touch-icon.png. -->
  <defs>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE0A8" stop-opacity="0"/>
      <stop offset="29.5%" stop-color="#FFE0A8" stop-opacity="0"/>
      <stop offset="30.5%" stop-color="#FFE0A8" stop-opacity="1"/>
      <stop offset="34%" stop-color="#FFA51F" stop-opacity=".72"/>
      <stop offset="52%" stop-color="#FFA51F" stop-opacity=".22"/>
      <stop offset="78%" stop-color="#FFA51F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#05060B"/>
  <rect width="512" height="512" fill="url(#corona)"/>
  <circle cx="256" cy="256" r="76.8" fill="#05060B"/>
</svg>
