<!-- La mitja lluna de la marca (public/brand/logo-mark.svg), engreixada per
     ser llegible a 16 px: a la mida d'una pestanya el creixent fi del logotip
     desapareixia. El que hi havia abans era un llamp lila d'una plantilla —
     el lila que el sistema de disseny prohibeix per escrit. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="eclipsi.info">
  <defs>
    <mask id="ec">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="30" cy="32" r="26" fill="#fff"/>
      <circle cx="39" cy="27" r="23" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#ec)">
    <circle cx="30" cy="32" r="26" fill="#FFA51F"/>
  </g>
</svg>
